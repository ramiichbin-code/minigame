<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minigame — Bildschirm</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;text-align:center;margin:0;padding:12px;background:#111;color:#eee}
    canvas{background:#222;display:block;margin:12px auto;border:2px solid #444}
    #qr{margin-top:8px;min-height:220px}
    #info{font-size:14px;color:#ccc;min-height:40px}
    .small{font-size:12px;color:#999}
    .loading{color:#ff9800;animation:pulse 1s infinite}
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  </style>
</head>
<body>
  <h1>🎮 Minigame — Bildschirm</h1>
  <canvas id="game" width="800" height="360"></canvas>
  <div id="info" class="loading">Lade Peer...</div>
  <div id="peerId" class="small" style="display:none;"></div>
  <div id="qr"></div>

  <script>
    // Async load mit Fallback
    async function loadLibraries() {
      // PeerJS
      const peerPromise = new Promise((resolve) => {
        const timeout = setTimeout(() => {
          console.warn('PeerJS timeout - fallback');
          const fallback = document.createElement('script');
          fallback.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js';
          fallback.onload = resolve;
          fallback.onerror = resolve;
          document.head.appendChild(fallback);
        }, 3000);

        const script = document.createElement('script');
        script.src = 'https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js';
        script.async = true;
        script.onload = () => { clearTimeout(timeout); resolve(); };
        script.onerror = () => {
          clearTimeout(timeout);
          console.error('PeerJS failed');
          resolve();
        };
        document.head.appendChild(script);
      });

      // QRCode
      const qrPromise = new Promise((resolve) => {
        const timeout = setTimeout(() => {
          console.warn('QRCode timeout - fallback');
          const fallback = document.createElement('script');
          fallback.src = 'https://unpkg.com/qrcode@1.4.4/build/qrcode.min.js';
          fallback.onload = resolve;
          fallback.onerror = resolve;
          document.head.appendChild(fallback);
        }, 2000);

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js';
        script.async = true;
        script.onload = () => { clearTimeout(timeout); resolve(); };
        script.onerror = () => {
          clearTimeout(timeout);
          console.error('QRCode failed');
          resolve();
        };
        document.head.appendChild(script);
      });

      await Promise.all([peerPromise, qrPromise]);
    }

    // Start game sofort, libraries im Hintergrund
    loadLibraries().then(() => {
      const scriptEl = document.createElement('script');
      scriptEl.src = 'game.js';
      scriptEl.async = true;
      document.body.appendChild(scriptEl);
    });
  </script>
</body>
</html>
